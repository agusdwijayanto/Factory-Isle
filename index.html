<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Indotopia — Growtopia versi kita</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="hud">
    <span>Koin <b id="hCoins">0</b></span>
    <span>Tugas <b id="hTask">0</b></span>
    <span><b id="hDay">Hari 1 · Semi</b> · <span id="hPhase">Siang</span></span>
    <span class="cycbar"><span id="hCyc"></span></span>
    <span>Pilih <b id="hSel">-</b></span>
    <span class="spacer"></span>
    <button id="btnInv">TAS</button>
    <button id="btnSkill">SKILL</button>
    <button id="btnBook">BUKU</button>
  </div>
  <div id="buildbar" hidden><span id="buildTxt"></span> <button id="btnCancel">BATAL</button></div>
  <div id="menu" hidden></div>
  <div id="panel" hidden></div>
  <div id="banner"></div>
  <div id="controls">
    <div id="moveBtns">
      <button id="btnLeft">◀</button>
      <button id="btnRight">▶</button>
    </div>
    <div id="btns">
      <button id="btnBuild">BANGUN</button>
      <button id="btnAct">AKSI</button>
      <button id="btnJump">LOMPAT</button>
    </div>
  </div>
</div>
<p id="hint">Laptop: A/D jalan, W/spasi lompat, spasi/klik pukul, E interaksi, B bangun, I tas, P skill, O buku resep, scroll zoom. HP: tombol kiri/kanan/lompat/aksi, ketuk petak untuk pukul/tanam.</p>
<script src="js/01-core.js?v=2"></script>
<script src="js/02-physics.js?v=2"></script>
<script src="js/03-blocks.js?v=2"></script>
<script src="js/04-farming.js?v=2"></script>
<script src="js/05-splice.js?v=2"></script>
<script src="js/06-crafting.js?v=2"></script>
<script src="js/07-economy.js?v=2"></script>
<script src="js/08-skills.js?v=2"></script>
<script src="js/09-npc.js?v=2"></script>
<script src="js/10-ui.js?v=2"></script>
<script src="js/11-update.js?v=2"></script>
<script src="js/12-render.js?v=2"></script>
<script src="js/13-main.js?v=2"></script>
</body>
</html>
